<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Build Your Own De{c0}dE — Codelab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand-red: #e62e4d;
        --brand-pink: #e01e5a;
        --brand-purple: #6929ca;
        --brand-gradient: linear-gradient(
          135deg,
          var(--brand-red) 0%,
          var(--brand-pink) 45%,
          var(--brand-purple) 100%
        );
      }
      html[data-theme="dark"] {
        --bg: #101012;
        --bg-subtle: #17171a;
        --surface: #1b1b1f;
        --surface-hover: #232327;
        --text: #f2f2f4;
        --text-muted: #b3b3ba;
        --text-subtle: #7c7c85;
        --border: #2a2a2f;
        --border-strong: #3a3a41;
        --success: #3fbf7a;
        --warning: #e0a838;
        --danger: #f0596b;
        --code-bg: #17171a;
      }
      html[data-theme="light"] {
        --bg: #ffffff;
        --bg-subtle: #f7f7f9;
        --surface: #ffffff;
        --surface-hover: #f0f0f3;
        --text: #15151a;
        --text-muted: #4a4a53;
        --text-subtle: #6b6b76;
        --border: #e2e2e8;
        --border-strong: #c6c6d0;
        --success: #157a43;
        --warning: #8a5a06;
        --danger: #b42440;
        --code-bg: #f6f6f8;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family: "Inter Tight", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .mono {
        font-family: "JetBrains Mono", ui-monospace, monospace;
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--brand-pink);
        outline-offset: 2px;
        border-radius: 4px;
      }
      .icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      .shell {
        display: grid;
        grid-template-columns: 300px 1fr;
        height: 100vh;
      }
      @media (max-width: 860px) {
        .shell {
          grid-template-columns: 1fr;
        }
      }

      .sidebar {
        border-right: 1px solid var(--border);
        background: var(--bg-subtle);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }
      @media (max-width: 860px) {
        .sidebar {
          position: fixed;
          inset: 0 15% 0 0;
          z-index: 30;
          transform: translateX(-100%);
          transition: transform 0.2s;
        }
        .sidebar.open {
          transform: translateX(0);
        }
      }
      .sidebar-top {
        padding: 18px 18px 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        font-weight: 600;
        font-size: 16px;
        text-decoration: none;
        color: var(--text);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .brand .b {
        background: var(--brand-gradient);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-family: "JetBrains Mono";
      }
      .icon-btn {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-muted);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .icon-btn:hover {
        background: var(--surface-hover);
        color: var(--text);
      }

      .progress-wrap {
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
      }
      .progress-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-subtle);
        margin: 0 0 8px;
        display: flex;
        justify-content: space-between;
      }
      .progress-track {
        height: 6px;
        border-radius: 999px;
        background: var(--surface-hover);
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: var(--brand-gradient);
        border-radius: 999px;
        transition: width 0.3s;
      }

      .chapter-list {
        list-style: none;
        margin: 0;
        padding: 10px;
      }
      .chapter-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 8px;
        font-size: 13.5px;
        color: var(--text-muted);
        cursor: pointer;
        transition:
          background-color 0.15s,
          color 0.15s;
      }
      .chapter-item:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .chapter-item.active {
        background: var(--surface-hover);
        color: var(--text);
        font-weight: 500;
      }
      .chapter-num {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 1px solid var(--border-strong);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        flex-shrink: 0;
        font-family: "JetBrains Mono";
      }
      .chapter-item.done .chapter-num {
        background: var(--success);
        border-color: var(--success);
        color: #fff;
      }
      .chapter-item.done .chapter-num::before {
        content: "\2713";
      }
      .chapter-item.done .chapter-num span {
        display: none;
      }

      .sidebar-links {
        margin-top: auto;
        padding: 16px 18px;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .sidebar-links a {
        font-size: 12.5px;
        color: var(--text-muted);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sidebar-links a:hover {
        color: var(--text);
      }

      .main {
        overflow-y: auto;
        height: 100vh;
      }
      .content {
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 32px 100px;
      }
      @media (max-width: 860px) {
        .content {
          padding: 24px 20px 100px;
        }
      }
      .mobile-menu-btn {
        display: none;
        position: fixed;
        top: 14px;
        left: 14px;
        z-index: 20;
      }
      @media (max-width: 860px) {
        .mobile-menu-btn {
          display: inline-flex;
        }
      }

      .chapter-eyebrow {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-subtle);
        margin: 0 0 8px;
      }
      .chapter-title {
        font-size: 30px;
        font-weight: 600;
        margin: 0 0 6px;
        letter-spacing: -0.01em;
      }
      .chapter-meta {
        font-size: 13px;
        color: var(--text-subtle);
        margin: 0 0 32px;
      }

      .content h2 {
        font-size: 19px;
        font-weight: 600;
        margin: 36px 0 12px;
      }
      .content h3 {
        font-size: 15px;
        font-weight: 600;
        margin: 24px 0 10px;
      }
      .content p {
        font-size: 15px;
        line-height: 1.7;
        color: var(--text-muted);
        margin: 0 0 14px;
      }
      .content ul,
      .content ol {
        padding-left: 22px;
        margin: 0 0 14px;
      }
      .content li {
        font-size: 15px;
        line-height: 1.7;
        color: var(--text-muted);
        margin-bottom: 6px;
      }
      .content strong {
        color: var(--text);
      }
      .content a.inline-link {
        color: var(--brand-pink);
        text-decoration: none;
        border-bottom: 1px solid currentColor;
      }

      .code-block {
        position: relative;
        margin: 0 0 20px;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .code-block-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .code-lang {
        font-size: 11px;
        color: var(--text-subtle);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .copy-btn {
        background: none;
        border: none;
        color: var(--text-subtle);
        cursor: pointer;
        font-size: 11.5px;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 3px 6px;
        border-radius: 5px;
      }
      .copy-btn:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .copy-btn.copied {
        color: var(--success);
      }
      pre {
        margin: 0;
        padding: 16px;
        background: var(--code-bg);
        overflow-x: auto;
      }
      pre code {
        font-family: "JetBrains Mono", monospace;
        font-size: 12.5px;
        line-height: 1.65;
        color: var(--text-muted);
        white-space: pre;
      }

      .callout {
        display: flex;
        gap: 12px;
        padding: 14px 16px;
        border-radius: 10px;
        margin: 0 0 20px;
        border: 1px solid;
      }
      .callout .icon {
        margin-top: 2px;
      }
      .callout-tip {
        background: color-mix(in srgb, var(--success) 8%, transparent);
        border-color: var(--success);
      }
      .callout-tip .icon {
        color: var(--success);
      }
      .callout-warning {
        background: color-mix(in srgb, var(--warning) 8%, transparent);
        border-color: var(--warning);
      }
      .callout-warning .icon {
        color: var(--warning);
      }
      .callout-story {
        background: color-mix(in srgb, var(--brand-pink) 6%, transparent);
        border-color: var(--brand-pink);
      }
      .callout-story .icon {
        color: var(--brand-pink);
      }
      .callout p {
        margin: 0;
        font-size: 13.5px;
        color: var(--text);
        line-height: 1.6;
      }
      .callout strong {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 4px;
        color: inherit;
      }

      .checkpoint {
        border: 1px dashed var(--border-strong);
        border-radius: 10px;
        padding: 16px;
        margin: 24px 0;
      }
      .checkpoint-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-subtle);
        margin: 0 0 8px;
      }
      .checkpoint p {
        margin: 0;
        font-size: 14px;
      }

      .link-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 0 0 20px;
      }
      @media (max-width: 600px) {
        .link-grid {
          grid-template-columns: 1fr;
        }
      }
      .link-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        text-decoration: none;
        color: var(--text);
        font-size: 13.5px;
        transition:
          border-color 0.15s,
          background-color 0.15s;
      }
      .link-card:hover {
        border-color: var(--border-strong);
        background: var(--surface-hover);
      }
      .link-card .icon {
        color: var(--brand-pink);
      }

      .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 48px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
      }
      .nav-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        border: 1px solid var(--border-strong);
        color: var(--text);
        background: var(--surface);
        cursor: pointer;
        font-family: inherit;
      }
      .nav-btn:hover {
        background: var(--surface-hover);
      }
      .nav-btn.primary {
        background: var(--brand-gradient);
        color: #fff;
        border: none;
      }
      .nav-btn.primary:hover {
        opacity: 0.92;
      }
      .nav-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
    </style>
  </head>

      const chapters = [
        {
          title: "Welcome",
          eyebrow: "00 · Introduction",
          meta: "5 min read",
          html: `
    <p>This codelab walks you through building <strong>De{c0}dE</strong> — an AI-powered code-analysis app — from an empty folder to a working Angular + Firebase application with real authentication, a database, and real AI-powered code analysis.</p>
    <p>It's the companion codelab for the NG Kenya 2026 talk <em>"From Idea to MVP: Building AI-Powered Angular Apps with Firebase."</em> Every command and every file in this codelab is exactly what it takes to get a real, working copy running on your machine — copy each file exactly as shown, run the commands in order, and by the end you'll have the full app running locally with no extra setup.</p>

    <h2>What you'll build</h2>
    <ul>
      <li>A 9-page Angular 22 app: landing, login, register, an authenticated workspace, settings, profile, and three informational pages (privacy, terms, brand)</li>
      <li>Real Firebase Authentication (email/password + Google sign-in)</li>
      <li>A Firestore data model with proper security rules, protecting each user's own data</li>
      <li>Real AI-powered code analysis via the Hugging Face Inference API — paste any code snippet, get a structured breakdown back</li>
      <li>Saved analysis history and working settings, both backed by real data</li>
    </ul>

    <h2>Prerequisites</h2>
    <ul>
      <li>Node.js 20 or newer, and npm — installed and on your PATH</li>
      <li>A free Google account (for Firebase)</li>
      <li>A free Hugging Face account (for the AI analysis)</li>
      <li>Basic familiarity with the command line — this codelab explains every command, but doesn't teach the terminal itself</li>
      <li>No prior Angular or Firebase experience required</li>
    </ul>

    <div class="callout callout-tip">
      <svg class="icon"><use href="#i-tip"/></svg>
      <div><strong>Want the finished code first?</strong><p>The complete, working source is on <a class="inline-link" href="https://github.com/aymanissa-dev/NG-KE-26" target="_blank">GitHub</a> — clone it, compare against it, or reference it if you get stuck on a step.</p></div>
    </div>

    <p>Ready? Let's scaffold the project.</p>
  `,
        },
        {
          title: "Scaffold the App",
          eyebrow: "01 · Foundation",
          meta: "10 min",
          html: `
    <p>Every Angular project starts with the CLI. Install it globally if you haven't already:</p>
    <div class="code-block"><div class="code-block-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)"><svg class="icon" style="width:12px;height:12px"><use href="#i-copy"/></svg> Copy</button></div><pre><code>npm install -g @angular/cli</code></pre></div>

    <p>Generate a service to manage the theme:</p>
    <div class="code-block"><div class="code-block-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)"><svg class="icon" style="width:12px;height:12px"><use href="#i-copy"/></svg> Copy</button></div><pre><code>ng generate service core/theme --skip-tests</code></pre></div>

    <p>Replace the entire contents of <code class="mono">src/app/core/theme.ts</code> with this:</p>
    <div class="code-block"><div class="code-block-header"><span class="code-lang">typescript — src/app/core/theme.ts (complete file)</span><button class="copy-btn" onclick="copyCode(this)"><svg class="icon" style="width:12px;height:12px"><use href="#i-copy"/></svg> Copy</button></div><pre><code>import { Injectable, signal, computed, effect } from '@angular/core';

export type ThemeChoice = 'system' | 'light' | 'dark';
export type ResolvedTheme = 'light' | 'dark';

const STORAGE_KEY = 'decode-theme';

@Injectable({ providedIn: 'root' })
export class ThemeService {
  private systemPrefersDark = signal(window.matchMedia('(prefers-color-scheme: dark)').matches);

  choice = signal&lt;ThemeChoice&gt;(this.getStoredChoice());

  resolvedTheme = computed&lt;ResolvedTheme&gt;(() =&gt; {
    const current = this.choice();
    return current === 'system' ? (this.systemPrefersDark() ? 'dark' : 'light') : current;
  });

  constructor() {
    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
    mediaQuery.addEventListener('change', (event) =&gt; {
      this.systemPrefersDark.set(event.matches);
    });

    effect(() =&gt; {
      document.documentElement.setAttribute('data-theme', this.resolvedTheme());
    });
  }

  setChoice(choice: ThemeChoice): void {
    this.choice.set(choice);
    localStorage.setItem(STORAGE_KEY, choice);
  }

  toggle(): void {
    this.setChoice(this.resolvedTheme() === 'dark' ? 'light' : 'dark');
  }

  private getStoredChoice(): ThemeChoice {
    const stored = localStorage.getItem(STORAGE_KEY);
    return stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
  }
}
</code></pre></div>

    <p>Now the real thing: a signal-based auth service supporting email/password registration, email/password login, and Google sign-in — plus a Firestore profile document created automatically for every new user.</p>

    <div class="code-block"><div class="code-block-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)"><svg class="icon" style="width:12px;height:12px"><use href="#i-copy"/></svg> Copy</button></div><pre><code>ng generate service core/auth --skip-tests</code></pre></div>

    <p>Replace the entire contents of <code class="mono">src/app/core/auth.ts</code> with this:</p>
    <div class="code-block"><div class="code-block-header"><span class="code-lang">typescript — src/app/core/auth.ts (complete file)</span><button class="copy-btn" onclick="copyCode(this)"><svg class="icon" style="width:12px;height:12px"><use href="#i-copy"/></svg> Copy</button></div><pre><code>import { Injectable, signal } from '@angular/core';
import {
  Auth,
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signInWithPopup,
  GoogleAuthProvider,
  signOut,
  deleteUser,
  onAuthStateChanged,
  User,
} from 'firebase/auth';
import {
  Firestore,
  getFirestore,
  doc,
  getDoc,
  setDoc,
  deleteDoc,
  serverTimestamp,
} from 'firebase/firestore';
import { firebaseApp } from './firebase.config';

@Injectable({ providedIn: 'root' })
export class AuthService {
  private auth: Auth = getAuth(firebaseApp);
  private firestore: Firestore = getFirestore(firebaseApp);
  currentUser = signal&lt;User | null&gt;(null);

  private resolveAuthReady!: () =&gt; void;
  authReady: Promise&lt;void&gt; = new Promise((resolve) =&gt; {
    this.resolveAuthReady = resolve;
  });

  constructor() {
    onAuthStateChanged(this.auth, (user) =&gt; {
      this.currentUser.set(user);
      this.resolveAuthReady();
    });
  }

  async register(email: string, password: string): Promise&lt;void&gt; {
    const credential = await createUserWithEmailAndPassword(this.auth, email, password);
    await setDoc(doc(this.firestore, 'users', credential.user.uid), {
      email: credential.user.email,
      displayName: '',
      createdAt: serverTimestamp(),
    });
  }

  async login(email: string, password: string): Promise&lt;void&gt; {
    await signInWithEmailAndPassword(this.auth, email, password);
  }

  async loginWithGoogle(): Promise&lt;void&gt; {
    const provider = new GoogleAuthProvider();
    const credential = await signInWithPopup(this.auth, provider);

    const userDocRef = doc(this.firestore, 'users', credential.user.uid);
    const existing = await getDoc(userDocRef);
    if (!existing.exists()) {
      await setDoc(userDocRef, {
        email: credential.user.email,
        displayName: credential.user.displayName ?? '',
        createdAt: serverTimestamp(),
      });
    }
  }

  async logout(): Promise&lt;void&gt; {
    await signOut(this.auth);
  }

  async deleteAccount(): Promise&lt;void&gt; {
    const user = this.auth.currentUser;
    if (!user) throw new Error('Not signed in.');

    await deleteDoc(doc(this.firestore, 'users', user.uid));
    await deleteUser(user);
  }
}

import { FormsModule } from '@angular/forms';
import { Router, RouterLink } from '@angular/router';
import { AuthService } from '../../core/auth';
import { ThemeService } from '../../core/theme';

@Component({
  selector: 'app-login',
  imports: [FormsModule, RouterLink],
  templateUrl: './login.html',
  styleUrl: './login.scss',
})
export class Login {
  email = '';
  password = '';
  showPassword = signal(false);
  errorMessage = signal&lt;string | null&gt;(null);
  isSubmitting = signal(false);

  constructor(
    private authService: AuthService,
    private router: Router,
    protected themeService: ThemeService
  ) {}

  togglePasswordVisibility(): void {
    this.showPassword.update((v) =&gt; !v);
  }

  async onSubmit(): Promise&lt;void&gt; {
    this.errorMessage.set(null);
    this.isSubmitting.set(true);
    try {
      await this.authService.login(this.email, this.password);
      this.router.navigate(['/workspace']);
    } catch (err: any) {
      this.errorMessage.set(this.friendlyError(err.code));
    } finally {
      this.isSubmitting.set(false);
    }
  }

  async onGoogleSignIn(): Promise&lt;void&gt; {
    this.errorMessage.set(null);
    try {
      await this.authService.loginWithGoogle();
      this.router.navigate(['/workspace']);
    } catch (err: any) {
      if (err.code !== 'auth/popup-closed-by-user') {
        this.errorMessage.set('Google sign-in failed. Please try again.');
      }
    }
  }

  private friendlyError(code: string): string {
    switch (code) {
      case 'auth/invalid-credential':
      case 'auth/wrong-password':
      case 'auth/user-not-found':
        return 'Incorrect email or password.';
      case 'auth/invalid-email':
        return 'That email address looks invalid.';
      case 'auth/too-many-requests':
        return 'Too many attempts. Please wait a moment and try again.';
      default:
        return 'Something went wrong. Please try again.';
    }
  }
}
</code></pre></div>

    <p>Same pattern, plus a live password-strength checklist. Replace <code class="mono">src/app/pages/register/register.ts</code> with:</p>
    <div class="code-block"><div class="code-block-header"><span class="code-lang">typescript — src/app/pages/register/register.ts (complete file)</span><button class="copy-btn" onclick="copyCode(this)"><svg class="icon" style="width:12px;height:12px"><use href="#i-copy"/></svg> Copy</button></div><pre><code>import { Component, signal, computed } from '@angular/core';
import { FormsModule } from '@angular/forms';
import { Router, RouterLink } from '@angular/router';
import { AuthService } from '../../core/auth';

@Component({
  selector: 'app-register',
  imports: [FormsModule, RouterLink],
  templateUrl: './register.html',
  styleUrl: './register.scss',
})
export class Register {
  email = '';
  password = signal('');
  showPassword = signal(false);
  errorMessage = signal&lt;string | null&gt;(null);
  isSubmitting = signal(false);

  passwordChecks = computed(() =&gt; {
    const val = this.password();
    return {
      length: val.length &gt;= 8,
      upper: /[A-Z]/.test(val),
      lower: /[a-z]/.test(val),
      number: /[0-9]/.test(val),
      special: /[^A-Za-z0-9]/.test(val),
    };
  });

  constructor(
    private authService: AuthService,
    private router: Router
  ) {}

  togglePasswordVisibility(): void {
    this.showPassword.update((v) =&gt; !v);
  }

  async onSubmit(): Promise&lt;void&gt; {
    this.errorMessage.set(null);
    this.isSubmitting.set(true);
    try {
      await this.authService.register(this.email, this.password());
      this.router.navigate(['/workspace']);
    } catch (err: any) {
      this.errorMessage.set(this.friendlyError(err.code));
    } finally {
      this.isSubmitting.set(false);
    }
  }

  async onGoogleSignIn(): Promise&lt;void&gt; {
    this.errorMessage.set(null);
    try {
      await this.authService.loginWithGoogle();
      this.router.navigate(['/workspace']);
    } catch (err: any) {
      if (err.code !== 'auth/popup-closed-by-user') {
        this.errorMessage.set('Google sign-in failed. Please try again.');
      }
    }
  }

  private friendlyError(code: string): string {
    switch (code) {
      case 'auth/email-already-in-use':
        return 'An account with this email already exists.';
      case 'auth/invalid-email':
        return 'That email address looks invalid.';
      case 'auth/weak-password':
        return 'Password should be at least 6 characters.';
      default:
        return 'Something went wrong. Please try again.';
    }
  }
}
</code></pre></div>

import { FormsModule } from '@angular/forms';
import { Firestore, getFirestore, doc, getDoc, updateDoc } from 'firebase/firestore';
import { AppShell } from '../../shared/app-shell/app-shell';
import { AuthService } from '../../core/auth';
import { firebaseApp } from '../../core/firebase.config';

interface UserProfile {
  email: string;
  displayName: string;
}

@Component({
  selector: 'app-profile',
  imports: [FormsModule, AppShell],
  templateUrl: './profile.html',
  styleUrl: './profile.scss',
})
export class Profile implements OnInit {
  private firestore: Firestore = getFirestore(firebaseApp);

  profile = signal&lt;UserProfile | null&gt;(null);
  displayName = '';
  isLoading = signal(true);
  isSaving = signal(false);
  saveSuccess = signal(false);
  errorMessage = signal&lt;string | null&gt;(null);

  constructor(private authService: AuthService) {}

  async ngOnInit(): Promise&lt;void&gt; {
    await this.authService.authReady;

    const user = this.authService.currentUser();
    if (!user) {
      this.errorMessage.set('Not signed in.');
      this.isLoading.set(false);
      return;
    }

    try {
      const snapshot = await getDoc(doc(this.firestore, 'users', user.uid));
      if (snapshot.exists()) {
        const data = snapshot.data() as UserProfile;
        this.profile.set(data);
        this.displayName = data.displayName ?? '';
      }
    } catch {
      this.errorMessage.set('Could not load your profile.');
    } finally {
      this.isLoading.set(false);
    }
  }

  async onSave(): Promise&lt;void&gt; {
    const user = this.authService.currentUser();
    if (!user) return;

    this.isSaving.set(true);
    this.saveSuccess.set(false);
    this.errorMessage.set(null);

    try {
      await updateDoc(doc(this.firestore, 'users', user.uid), {
        displayName: this.displayName,
      });
      this.saveSuccess.set(true);
    } catch {
      this.errorMessage.set('Could not save your changes.');
    } finally {
      this.isSaving.set(false);
    }
  }
}

    <h2>The service</h2>
    <div class="code-block"><div class="code-block-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)"><svg class="icon" style="width:12px;height:12px"><use href="#i-copy"/></svg> Copy</button></div><pre><code>ng generate service core/huggingface --skip-tests</code></pre></div>

    <p>Replace <code class="mono">src/app/core/huggingface.ts</code> with:</p>
    <div class="code-block"><div class="code-block-header"><span class="code-lang">typescript — src/app/core/huggingface.ts (complete file)</span><button class="copy-btn" onclick="copyCode(this)"><svg class="icon" style="width:12px;height:12px"><use href="#i-copy"/></svg> Copy</button></div><pre><code>import { Injectable } from '@angular/core';
import { InferenceClient } from '@huggingface/inference';
import { HUGGINGFACE_TOKEN } from '../../environments/huggingface.secret';
import { CodeAnalysis } from './analysis.types';

const ANALYSIS_MODEL = 'meta-llama/Llama-3.1-8B-Instruct';

const SYSTEM_PROMPT = \`You are a code analysis assistant. Given a code snippet, respond with ONLY a raw JSON object (no markdown fences, no commentary) matching exactly this shape:

{
  "language": "the programming language",
  "summary": "one sentence describing what the code does",
  "explanation": "2-3 sentence plain-language explanation",
  "steps": ["step 1", "step 2", "..."],
  "issues": [{"severity": "high|medium|low", "title": "short title", "description": "1-2 sentence description"}],
  "suggestions": "1-2 sentence suggestion for improvement",
  "refactorBefore": "the original code, verbatim",
  "refactorAfter": "an improved version of the code",
  "score": {"maintainability": 0-100, "overallGrade": "A|B+|B|B-|C+|C|C-|D|F", "complexity": "Low|Medium|High", "readability": "Poor|Fair|Good|Excellent"},
  "followUps": ["short follow-up question 1", "short follow-up question 2", "short follow-up question 3"]
}

LANGUAGE DETECTION — determine "language" by examining the actual syntax present:
- HTML: tags like &lt;!DOCTYPE&gt;, &lt;html&gt;, &lt;div&gt;, &lt;script&gt;, &lt;style&gt; as structural markup. If the input is a full HTML document with embedded &lt;script&gt;/&lt;style&gt; blocks, the language is "HTML", not JavaScript.
- CSS: selectors with &#123; &#125; blocks, properties like "color:", no function keywords.
- JavaScript/TypeScript: "function", "const", "let", "=&gt;", "class", optionally ": type" annotations for TypeScript.
- Python: "def", "import", indentation-based blocks, no semicolons or braces.

If there are no issues, return an empty array for "issues". Respond with ONLY the JSON object, nothing else.\`;

@Injectable({
  providedIn: 'root',
})
export class HuggingfaceService {
  private client = new InferenceClient(HUGGINGFACE_TOKEN);

  async analyzeCode(code: string): Promise&lt;CodeAnalysis&gt; {
    const response = await this.client.chatCompletion({
      model: ANALYSIS_MODEL,
      messages: [
        { role: 'system', content: SYSTEM_PROMPT },
        { role: 'user', content: code },
      ],
      max_tokens: 2000,
      temperature: 0.3,
    });

    const raw = response.choices[0].message.content ?? '';
    return this.parseAnalysis(raw);
  }

  async askFollowUp(code: string, analysis: CodeAnalysis, question: string): Promise&lt;string&gt; {
    const response = await this.client.chatCompletion({
      model: ANALYSIS_MODEL,
      messages: [
        {
          role: 'system',
          content: \`You are a code analysis assistant. The user already analyzed this code:\\n\\n\${code}\\n\\nYour prior summary: \${analysis.summary}\\n\\nAnswer their follow-up question concisely, in plain text (no JSON, no markdown).\`,
        },
        { role: 'user', content: question },
      ],
      max_tokens: 400,
      temperature: 0.4,
    });

    return response.choices[0].message.content ?? '(no response)';
  }

  private parseAnalysis(raw: string): CodeAnalysis {
    const cleaned = raw.replace(/^\`\`\`json\\s*/i, '').replace(/\`\`\`\\s*$/, '').trim();

    try {
      const parsed = JSON.parse(cleaned);
      return parsed as CodeAnalysis;
    } catch (err) {
      throw new Error(\`Failed to parse model response as JSON: \${(err as Error).message}\\n\\nRaw response: \${cleaned.slice(0, 200)}\`);
    }
  }
}
</code></pre></div>

    <div class="code-block"><div class="code-block-header"><span class="code-lang">typescript — src/app/pages/workspace/workspace.ts (complete file)</span><button class="copy-btn" onclick="copyCode(this)"><svg class="icon" style="width:12px;height:12px"><use href="#i-copy"/></svg> Copy</button></div><pre><code>import { Component, signal } from '@angular/core';
import { FormsModule } from '@angular/forms';
import { AppShell } from '../../shared/app-shell/app-shell';
import { HuggingfaceService } from '../../core/huggingface';
import { CodeAnalysis } from '../../core/analysis.types';

type ViewState = 'input' | 'loading' | 'result';

const MAX_CODE_LENGTH = 3000;

@Component({
  selector: 'app-workspace',
  imports: [FormsModule, AppShell],
  templateUrl: './workspace.html',
  styleUrl: './workspace.scss',
})
export class Workspace {
  viewState = signal&lt;ViewState&gt;('input');
  codeInput = signal(
    'function getTotal(items) {\\n' +
    '  let total = 0\\n' +
    '  for (i = 0; i &lt; items.length; i++) {\\n' +
    '    total += items[i].price\\n' +
    '  }\\n' +
    '  return total\\n' +
    '}'
  );
  langBadge = signal('Not analyzed yet');
  followupInput = '';

  result = signal&lt;CodeAnalysis | null&gt;(null);
  errorMessage = signal&lt;string | null&gt;(null);
  followupAnswer = signal&lt;string | null&gt;(null);
  isAskingFollowup = signal(false);

  readonly maxCodeLength = MAX_CODE_LENGTH;

  private examples: Record&lt;number, string&gt; = {
    1: 'function getTotal(items) {\\n  let total = 0\\n  for (i = 0; i &lt; items.length; i++) {\\n    total += items[i].price\\n  }\\n  return total\\n}',
    2: 'async function loadUser(id) {\\n  let user\\n  fetchUser(id).then(u =&gt; user = u)\\n  return user\\n}',
    3: 'def find_duplicates(items):\\n    dupes = []\\n    for i in range(len(items)):\\n        for j in range(len(items)):\\n            if i != j and items[i] == items[j]:\\n                dupes.append(items[i])\\n    return dupes',
  };

  constructor(private huggingfaceService: HuggingfaceService) {}

  async runAnalysis(): Promise&lt;void&gt; {
    const code = this.codeInput().trim();
    if (!code) return;

    if (code.length &gt; MAX_CODE_LENGTH) {
      this.errorMessage.set(
        \`That snippet is \${code.length} characters — a bit long for this demo. Try something under \${MAX_CODE_LENGTH} characters.\`
      );
      return;
    }

    this.viewState.set('loading');
    this.errorMessage.set(null);
    this.followupAnswer.set(null);

    try {
      const analysis = await this.huggingfaceService.analyzeCode(this.codeInput());
      this.result.set(analysis);
      this.langBadge.set(\`Auto-detected: \${analysis.language}\`);
      this.viewState.set('result');
    } catch (err) {
      this.errorMessage.set((err as Error).message);
      this.viewState.set('input');
    }
  }

  newAnalysis(): void {
    this.viewState.set('input');
    this.codeInput.set('');
    this.result.set(null);
    this.followupAnswer.set(null);
    this.errorMessage.set(null);
    this.langBadge.set('Not analyzed yet');
  }

  loadExample(n: number): void {
    this.codeInput.set(this.examples[n]);
  }

  async askFollowup(preset?: string): Promise&lt;void&gt; {
    const question = preset ?? this.followupInput;
    if (!question.trim()) return;

    const analysis = this.result();
    if (!analysis) return;

    this.isAskingFollowup.set(true);
    this.followupAnswer.set(null);

    try {
      const answer = await this.huggingfaceService.askFollowUp(this.codeInput(), analysis, question);
      this.followupAnswer.set(answer);
    } catch (err) {
      this.followupAnswer.set(\`Sorry, something went wrong: \${(err as Error).message}\`);
    } finally {
      this.isAskingFollowup.set(false);
      this.followupInput = '';
    }
  }
}
</code></pre></div>

export type Density = 'comfortable' | 'compact';
export type ExplanationLevel = 'beginner' | 'intermediate' | 'advanced';

const STORAGE_KEY = 'decode-settings';

interface StoredSettings {
  density: Density;
  explanationLevel: ExplanationLevel;
  fontSize: number;
  motionEnabled: boolean;
}

const DEFAULTS: StoredSettings = {
  density: 'comfortable',
  explanationLevel: 'intermediate',
  fontSize: 13,
  motionEnabled: true,
};

@Injectable({ providedIn: 'root' })
export class SettingsService {
  density = signal&lt;Density&gt;(DEFAULTS.density);
  explanationLevel = signal&lt;ExplanationLevel&gt;(DEFAULTS.explanationLevel);
  fontSize = signal&lt;number&gt;(DEFAULTS.fontSize);
  motionEnabled = signal&lt;boolean&gt;(DEFAULTS.motionEnabled);

  constructor() {
    const stored = this.readStored();
    this.density.set(stored.density);
    this.explanationLevel.set(stored.explanationLevel);
    this.fontSize.set(stored.fontSize);
    this.motionEnabled.set(stored.motionEnabled);

    effect(() =&gt; {
      document.documentElement.style.setProperty('--code-font-size', \`\${this.fontSize()}px\`);
      document.documentElement.setAttribute('data-density', this.density());
      document.documentElement.setAttribute('data-motion', this.motionEnabled() ? 'on' : 'off');
      this.persist();
    });
  }

  setDensity(value: Density): void { this.density.set(value); }
  setExplanationLevel(value: ExplanationLevel): void { this.explanationLevel.set(value); }
  setFontSize(value: number): void { this.fontSize.set(value); }
  setMotionEnabled(value: boolean): void { this.motionEnabled.set(value); }

  private persist(): void {
    const value: StoredSettings = {
      density: this.density(),
      explanationLevel: this.explanationLevel(),
      fontSize: this.fontSize(),
      motionEnabled: this.motionEnabled(),
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(value));
  }

  private readStored(): StoredSettings {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return DEFAULTS;
      return { ...DEFAULTS, ...JSON.parse(raw) };
    } catch {
      return DEFAULTS;
    }
  }
}

    <div class="code-block"><div class="code-block-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)"><svg class="icon" style="width:12px;height:12px"><use href="#i-copy"/></svg> Copy</button></div><pre><code>ng generate service core/history --skip-tests</code></pre></div>

    <p>Replace <code class="mono">src/app/core/history.ts</code> with:</p>
    <div class="code-block"><div class="code-block-header"><span class="code-lang">typescript — src/app/core/history.ts (complete file)</span><button class="copy-btn" onclick="copyCode(this)"><svg class="icon" style="width:12px;height:12px"><use href="#i-copy"/></svg> Copy</button></div><pre><code>import { Injectable, signal } from '@angular/core';
import {
  Firestore, getFirestore, collection, addDoc, deleteDoc,
  query, orderBy, limit, getDocs, doc, getDoc, serverTimestamp,
} from 'firebase/firestore';
import { firebaseApp } from './firebase.config';
import { AuthService } from './auth';
import { CodeAnalysis } from './analysis.types';

export interface HistoryEntry {
  id: string;
  codeSnippet: string;
  language: string;
  summary: string;
  analysis: CodeAnalysis;
  createdAt: Date | null;
}

@Injectable({ providedIn: 'root' })
export class HistoryService {
  private firestore: Firestore = getFirestore(firebaseApp);

  recent = signal&lt;HistoryEntry[]&gt;([]);
  selectedAnalysisId = signal&lt;string | null&gt;(null);

  constructor(private authService: AuthService) {}

  async loadRecent(max = 8): Promise&lt;void&gt; {
    const user = this.authService.currentUser();
    if (!user) { this.recent.set([]); return; }

    try {
      const colRef = collection(this.firestore, 'users', user.uid, 'analyses');
      const q = query(colRef, orderBy('createdAt', 'desc'), limit(max));
      const snapshot = await getDocs(q);

      this.recent.set(
        snapshot.docs.map((d) =&gt; {
          const data = d.data() as any;
          return {
            id: d.id,
            codeSnippet: data.codeSnippet,
            language: data.language,
            summary: data.summary,
            analysis: data.analysis,
            createdAt: data.createdAt?.toDate?.() ?? null,
          };
        })
      );
    } catch (err) {
      console.error('Failed to load history:', err);
      this.recent.set([]);
    }
  }

  async save(codeSnippet: string, analysis: CodeAnalysis): Promise&lt;void&gt; {
    const user = this.authService.currentUser();
    if (!user) return;

    const colRef = collection(this.firestore, 'users', user.uid, 'analyses');
    await addDoc(colRef, {
      codeSnippet, language: analysis.language, summary: analysis.summary,
      analysis, createdAt: serverTimestamp(),
    });

    await this.loadRecent();
  }

  async deleteEntry(id: string): Promise&lt;void&gt; {
    const user = this.authService.currentUser();
    if (!user) return;

    await deleteDoc(doc(this.firestore, 'users', user.uid, 'analyses', id));
    if (this.selectedAnalysisId() === id) this.selectedAnalysisId.set(null);
    await this.loadRecent();
  }

  async deleteAllEntries(): Promise&lt;void&gt; {
    const user = this.authService.currentUser();
    if (!user) return;

    const colRef = collection(this.firestore, 'users', user.uid, 'analyses');
    const snapshot = await getDocs(colRef);
    await Promise.all(snapshot.docs.map((d) =&gt; deleteDoc(d.ref)));

    this.recent.set([]);
    this.selectedAnalysisId.set(null);
  }

  async getById(id: string): Promise&lt;HistoryEntry | null&gt; {
    const user = this.authService.currentUser();
    if (!user) return null;

    const docRef = doc(this.firestore, 'users', user.uid, 'analyses', id);
    const snapshot = await getDoc(docRef);
    if (!snapshot.exists()) return null;

    const data = snapshot.data() as any;
    return {
      id: snapshot.id, codeSnippet: data.codeSnippet, language: data.language,
      summary: data.summary, analysis: data.analysis,
      createdAt: data.createdAt?.toDate?.() ?? null,
    };
  }

  selectAnalysis(id: string): void { this.selectedAnalysisId.set(id); }
  clearSelection(): void { this.selectedAnalysisId.set(null); }
}

    <p>Update <code class="mono">src/app/pages/workspace/workspace.ts</code> — this is the same file from Chapter 17, with history save/load added. Replace the whole file:</p>
    <div class="code-block"><div class="code-block-header"><span class="code-lang">typescript — src/app/pages/workspace/workspace.ts (complete file)</span><button class="copy-btn" onclick="copyCode(this)"><svg class="icon" style="width:12px;height:12px"><use href="#i-copy"/></svg> Copy</button></div><pre><code>import { Component, OnInit, effect, signal } from '@angular/core';
import { FormsModule } from '@angular/forms';
import { AppShell } from '../../shared/app-shell/app-shell';
import { HuggingfaceService } from '../../core/huggingface';
import { HistoryService } from '../../core/history';
import { CodeAnalysis } from '../../core/analysis.types';

type ViewState = 'input' | 'loading' | 'result';
const MAX_CODE_LENGTH = 3000;

@Component({
  selector: 'app-workspace',
  imports: [FormsModule, AppShell],
  templateUrl: './workspace.html',
  styleUrl: './workspace.scss',
})
export class Workspace implements OnInit {
  viewState = signal&lt;ViewState&gt;('input');
  codeInput = signal(
    'function getTotal(items) {\\n' +
    '  let total = 0\\n' +
    '  for (i = 0; i &lt; items.length; i++) {\\n' +
    '    total += items[i].price\\n' +
    '  }\\n' +
    '  return total\\n' +
    '}'
  );
  langBadge = signal('Not analyzed yet');
  followupInput = '';

  result = signal&lt;CodeAnalysis | null&gt;(null);
  errorMessage = signal&lt;string | null&gt;(null);
  followupAnswer = signal&lt;string | null&gt;(null);
  isAskingFollowup = signal(false);

  readonly maxCodeLength = MAX_CODE_LENGTH;

  private examples: Record&lt;number, string&gt; = {
    1: 'function getTotal(items) {\\n  let total = 0\\n  for (i = 0; i &lt; items.length; i++) {\\n    total += items[i].price\\n  }\\n  return total\\n}',
    2: 'async function loadUser(id) {\\n  let user\\n  fetchUser(id).then(u =&gt; user = u)\\n  return user\\n}',
    3: 'def find_duplicates(items):\\n    dupes = []\\n    for i in range(len(items)):\\n        for j in range(len(items)):\\n            if i != j and items[i] == items[j]:\\n                dupes.append(items[i])\\n    return dupes',
  };

  constructor(
    private huggingfaceService: HuggingfaceService,
    private historyService: HistoryService
  ) {
    effect(() =&gt; {
      const id = this.historyService.selectedAnalysisId();
      if (id) this.loadHistoryEntry(id);
    });
  }

  async ngOnInit(): Promise&lt;void&gt; {
    const id = this.historyService.selectedAnalysisId();
    if (id) await this.loadHistoryEntry(id);
  }

  private async loadHistoryEntry(id: string): Promise&lt;void&gt; {
    const entry = await this.historyService.getById(id);
    if (!entry) return;

    this.codeInput.set(entry.codeSnippet);
    this.result.set(entry.analysis);
    this.langBadge.set(\`Auto-detected: \${entry.analysis.language}\`);
    this.viewState.set('result');
    this.followupAnswer.set(null);
  }

  async runAnalysis(): Promise&lt;void&gt; {
    const code = this.codeInput().trim();
    if (!code) return;

    if (code.length &gt; MAX_CODE_LENGTH) {
      this.errorMessage.set(\`That snippet is \${code.length} characters — try something under \${MAX_CODE_LENGTH}.\`);
      return;
    }

    this.viewState.set('loading');
    this.errorMessage.set(null);
    this.followupAnswer.set(null);

    try {
      const analysis = await this.huggingfaceService.analyzeCode(this.codeInput());
      this.result.set(analysis);
      this.langBadge.set(\`Auto-detected: \${analysis.language}\`);
      this.viewState.set('result');

      await this.historyService.save(this.codeInput(), analysis);
    } catch (err) {
      this.errorMessage.set((err as Error).message);
      this.viewState.set('input');
    }
  }

  newAnalysis(): void {
    this.historyService.clearSelection();
    this.viewState.set('input');
    this.codeInput.set('');
    this.result.set(null);
    this.followupAnswer.set(null);
    this.errorMessage.set(null);
    this.langBadge.set('Not analyzed yet');
  }

  loadExample(n: number): void { this.codeInput.set(this.examples[n]); }

  async askFollowup(preset?: string): Promise&lt;void&gt; {
    const question = preset ?? this.followupInput;
    if (!question.trim()) return;

    const analysis = this.result();
    if (!analysis) return;

    this.isAskingFollowup.set(true);
    this.followupAnswer.set(null);

    try {
      const answer = await this.huggingfaceService.askFollowUp(this.codeInput(), analysis, question);
      this.followupAnswer.set(answer);
    } catch (err) {
      this.followupAnswer.set(\`Sorry, something went wrong: \${(err as Error).message}\`);
    } finally {
      this.isAskingFollowup.set(false);
      this.followupInput = '';
    }
  }
}

    <h2>What this app doesn't do (on purpose)</h2>
    <p>This codelab builds a real, working app — but it's honest to name what a production version would still need:</p>

      function goTo(i) {
        if (i < 0 || i >= chapters.length) return;

      function copyCode(btn) {
        const code = btn.closest(".code-block").querySelector("code").innerText;
        const showCopied = () => {
          const original = btn.innerHTML;
          btn.innerHTML =
            '<svg class="icon" style="width:12px;height:12px"><use href="#i-check"/></svg> Copied';
          btn.classList.add("copied");
          setTimeout(() => {
            btn.innerHTML = original;
            btn.classList.remove("copied");
          }, 1500);
        };
        const showFailed = () => {
          const original = btn.innerHTML;
          btn.innerHTML = "Copy failed — select manually";
          setTimeout(() => {
            btn.innerHTML = original;
          }, 2000);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard
            .writeText(code)
            .then(showCopied)
            .catch(() => {
              if (!fallbackCopy(code)) showFailed();
              else showCopied();
            });
        } else {
          if (fallbackCopy(code)) showCopied();
          else showFailed();
        }
      }

      function fallbackCopy(text) {
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          return ok;
        } catch (e) {
          return false;
        }
      }

      const root = document.documentElement;

        root.setAttribute("data-theme", next);
        localStorage.setItem("codelab-theme", next);
        setThemeIcon(next);
      });
